<html lang="pt-BR">

<title>Preciso de Ajuda com o Lucca 🍼</title>
<style>
  :root {
    --pink: #3a5f9e;
    --pink-dark: #16223d;
    --cream: #0e1524;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    background: rgba(20,26,42,0.85);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 40px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  h1 {
    font-size: 1.4rem;
    color: var(--pink-dark);
    margin: 0 0 8px;
  }
  p.sub {
    color: #a35;
    font-size: 0.95rem;
    margin: 0 0 28px;
  }
  button#sendBtn {
    border: none;
    background: radial-gradient(circle at 30% 30%, #4a75b8, var(--pink) 45%, var(--pink-dark) 100%);
    color: #dce6f5;
    font-size: 1.5rem;
    font-weight: 700;
    padding: 60px 28px;
    border-radius: 32px;
    width: 100%;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.5),
      0 0 0 6px rgba(255,255,255,0.06),
      inset 0 -6px 12px rgba(0,0,0,0.25),
      inset 0 6px 12px rgba(255,255,255,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    letter-spacing: 0.3px;
  }
  button#sendBtn:active {
    transform: scale(0.96);
    box-shadow:
      0 10px 20px rgba(0, 0, 0, 0.5),
      0 0 0 6px rgba(255,255,255,0.06),
      inset 0 -3px 8px rgba(0,0,0,0.3),
      inset 0 3px 8px rgba(255,255,255,0.06);
  }
  button#sendBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .heart {
    font-size: 3.6rem;
    animation: pulse 1.8s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  #status {
    margin-top: 18px;
    font-size: 0.9rem;
    min-height: 20px;
    color: #8ea6d0;
  }
  #status.ok { color: #4fd681; font-weight: 600; }
  select {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #f2b6c9;
    background: white;
    color: #a35;
    font-size: 0.9rem;
  }
</style>
</head>

<script>
  // Tópico único do casal — mantenha em segredo, é como se fosse uma "chave"
  const TOPIC = "amor-47ynavw6xr";
  const URL = "https://ntfy.sh/" + TOPIC;

  const btn = document.getElementById("sendBtn");
  const status = document.getElementById("status");
  const wakeStatus = document.getElementById("wakeStatus");
  const keepAlive = document.getElementById("keepAlive");

  // Vídeo mudo em loop: no iOS isso impede o bloqueio automático da tela
  function garantirVideoRodando() {
    if (keepAlive && keepAlive.paused) {
      keepAlive.play().catch(() => {});
    }
  }
  garantirVideoRodando();
  document.addEventListener("click", garantirVideoRodando);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") garantirVideoRodando();
  });

  // Mantém a tela sempre ativa (não apaga nem trava sozinha)
  let wakeLock = null;
  async function ativarWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeStatus.textContent = "🔆 Tela sempre ativa";
        wakeLock.addEventListener("release", () => {
          wakeStatus.textContent = "🔒 Toque na tela pra reativar";
        });
      } else {
        wakeStatus.textContent = "⚠️ Este navegador não suporta manter a tela ativa — ajuste o tempo de bloqueio automático nas configurações do celular";
      }
    } catch (err) {
      wakeStatus.textContent = "🔒 Toque na tela pra ativar";
    }
  }
  ativarWakeLock();
  // Reativa quando a página volta a ficar visível
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") ativarWakeLock();
  });
  // Alguns navegadores só permitem pedir o wake lock em resposta a um toque —
  // qualquer toque na tela tenta reativar
  document.addEventListener("click", () => {
    if (!wakeLock || wakeLock.released) ativarWakeLock();
  });

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    if (navigator.vibrate) navigator.vibrate(80);
    status.textContent = "Enviando...";
    status.className = "";
    try {
      await fetch(URL, {
        method: "POST",
        headers: {
          "Title": "Ajuda com o Lucca",
          "Tags": "baby",
          "Priority": "urgent"
        },
        body: "Vem aqui, preciso de você com o Lucca 🍼"
      });
      status.textContent = "Chamado enviado ✅";
      status.className = "ok";
    } catch (err) {
      status.textContent = "Sem internet — tente de novo";
    } finally {
      setTimeout(() => { btn.disabled = false; status.textContent = ""; }, 2000);
    }
  });
