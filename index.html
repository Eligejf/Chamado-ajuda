  button#sendBtn:active {
    transform: scale(0.96);
    box-shadow:
      0 10px 20px rgba(0, 0, 0, 0.5),
      0 0 0 6px rgba(255,255,255,0.06),
      inset 0 -3px 8px rgba(0,0,0,0.3),
      inset 0 3px 8px rgba(255,255,255,0.06);
  }
  button#sendBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  button#superBtn {
    margin-top: 16px;
    border: 1px solid rgba(220,230,245,0.25);
    background: rgba(255,255,255,0.04);
    color: #a9bad8;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 14px;
    width: 100%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;

    transition: transform 0.15s ease, background 0.15s ease;

    transform: scale(0.97);

  }
  button#superBtn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .heart {
    font-size: 3.6rem;
    animation: pulse 1.8s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  img.heart {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  #status {
    margin-top: 18px;
    font-size: 0.9rem;
    min-height: 20px;
    color: #8ea6d0;
  }
  #status.ok { color: #4fd681; font-weight: 600; }
  select {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #f2b6c9;
    background: white;
    color: #a35;
    font-size: 0.9rem;
  }

    <div id="status"></div>
    <div id="wakeStatus" style="margin-top:10px; font-size:0.75rem; color:#5c729e; opacity:0.8;"></div>
  </div>

<script>
  // Tópico único do casal — mantenha em segredo, é como se fosse uma "chave"
  const TOPIC = "amor-47ynavw6xr";
  const URL = "https://ntfy.sh/" + TOPIC;

  const btn = document.getElementById("sendBtn");
  const superBtn = document.getElementById("superBtn");
  const status = document.getElementById("status");
  const wakeStatus = document.getElementById("wakeStatus");
  const keepAlive = document.getElementById("keepAlive");

  // Vídeo mudo em loop: no iOS isso impede o bloqueio automático da tela
  function garantirVideoRodando() {
    if (keepAlive && keepAlive.paused) {
      keepAlive.play().catch(() => {});
    }
  }
  garantirVideoRodando();
  document.addEventListener("click", garantirVideoRodando);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") garantirVideoRodando();
  });

  // Mantém a tela sempre ativa (não apaga nem trava sozinha)
  let wakeLock = null;
  async function ativarWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeStatus.textContent = "🔆 Tela sempre ativa";
        wakeLock.addEventListener("release", () => {
          wakeStatus.textContent = "🔒 Toque na tela pra reativar";
        });
      } else {
        wakeStatus.textContent = "⚠️ Este navegador não suporta manter a tela ativa — ajuste o tempo de bloqueio automático nas configurações do celular";
      }
    } catch (err) {
      wakeStatus.textContent = "🔒 Toque na tela pra ativar";
    }
  }
  ativarWakeLock();
  // Reativa quando a página volta a ficar visível
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") ativarWakeLock();
  });
  // Alguns navegadores só permitem pedir o wake lock em resposta a um toque —
  // qualquer toque na tela tenta reativar
  document.addEventListener("click", () => {
    if (!wakeLock || wakeLock.released) ativarWakeLock();
  });

  function esperar(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function enviarNotificacao(titulo, corpo) {
    await fetch(URL, {
      method: "POST",
      headers: {
        "Title": titulo,
        "Tags": "baby",
        "Priority": "urgent"
      },
      body: corpo
    });
  }

  async function dispararChamado(qtd, titulo, corpo, statusPrefixo) {
    btn.disabled = true;
    superBtn.disabled = true;
    try {
      for (let i = 1; i <= qtd; i++) {
        status.textContent = `${statusPrefixo} (${i}/${qtd})...`;
        status.className = "";
        await enviarNotificacao(titulo, corpo);
        if (i < qtd) await esperar(1200);
      }
      status.textContent = `${qtd} chamados enviados ✅`;
      status.className = "ok";
    } catch (err) {
      status.textContent = "Erro ao enviar: " + (err && err.message ? err.message : "tente de novo");
    } finally {
      setTimeout(() => { btn.disabled = false; superBtn.disabled = false; status.textContent = ""; }, 2000);
    }
  }

  btn.addEventListener("click", () => {
    if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 80]);
    dispararChamado(5, "Ajuda com o Lucca", "Vem aqui, preciso de você com o Lucca 🍼", "Enviando chamado");
  });

  superBtn.addEventListener("click", () => {
    if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 80, 60, 80, 60, 80, 60]);
    dispararChamado(10, "SUPER CHAMADO - Lucca", "URGENTE: vem agora, preciso de você com o Lucca! 🍼🚨", "Enviando SUPER chamado");
  });
</script>
